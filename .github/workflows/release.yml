# Releases Choix: for a pushed tag v<major>.<minor>.<patch> with major 2 or
# later, a Developer ID signed and notarized Choix-<version>-arm64.dmg on a
# GitHub release, and the Homebrew cask in volodymyrsmirnov/homebrew-tap
# pointing at it. Run by hand (workflow_dispatch) it is a dry run.
#
#   gate        Resolves the version and the kind of run, and checks the
#               secrets (only whether each is empty; none is printed).
#               A release tag with a missing secret fails here, naming it.
#   build       task package: the arm64 Choix.app, signed ad hoc, uploaded as
#               the artifact "Choix-app" (zipped with ditto, which keeps the
#               signature and the bundle's symlinks and modes).
#   sign        Imports the Developer ID certificate into a throwaway
#               keychain, resolves the signing identity from it, stores the
#               notary key there as a notarytool keychain profile, then runs
#               task sign:developer-id notarize dmg notarize:dmg
#               verify:release. Uploads the disk image as "Choix-dmg".
#   mas         Imports the Apple Distribution and Mac Installer
#               Distribution certificates into a throwaway keychain, resolves
#               both identities from it, decodes the provisioning profile,
#               then runs task package:mas. Uploads bin/Choix-<version>.pkg
#               as the artifact "Choix-mas-pkg", never to the GitHub release:
#               the upload to App Store Connect (Transporter) stays manual.
#               The release does not wait for it.
#   release     gh release create v<version> with the disk image (the only
#               job with contents: write); outputs the image's SHA-256.
#   homebrew    The tap's reusable update.yml writes Casks/choix.rb.
#
# Triggers:
#   push of a tag v<major>.<minor>.<patch>, major >= 2 (the v0.1.x tags of
#     the old CLI never match): every job runs; a missing secret fails gate.
#   workflow_dispatch: a dry run. gate and build always run; sign runs only
#     when the five signing secrets are set, and mas only when the six Mac
#     App Store secrets are set (a fork has none: the run summary says what
#     was skipped); release and homebrew never run.
#
# Repository secrets (the same names as in volodymyrsmirnov/diriger):
#   MACOS_CERTIFICATE       base64 of a .p12 with the Developer ID
#                           Application certificate and its private key
#   MACOS_CERTIFICATE_PWD   the .p12's password
#   APPSTORE_KEY_ID         App Store Connect API key ID
#   APPSTORE_ISSUER_ID      its issuer ID
#   APPSTORE_PRIVATE_KEY    base64 of the API key's .p8 file
#   TAP_GITHUB_TOKEN        a token that can push to volodymyrsmirnov/homebrew-tap
#   MAS_APP_CERTIFICATE     base64 of a .p12 with the Apple Distribution
#                           certificate and its private key
#   MAS_APP_CERTIFICATE_PWD the .p12's password
#   MAS_INSTALLER_CERTIFICATE  base64 of a .p12 with the Mac Installer
#                           Distribution certificate and its private key
#   MAS_INSTALLER_CERTIFICATE_PWD  the .p12's password
#   MAS_PROVISIONING_PROFILE   base64 of the Mac App Store .provisionprofile
#   APPLE_TEAM_ID           the 10-character Team ID
# Secrets reach scripts only through env (never by ${{ }} inside a script)
# and are never printed. The Taskfile reads CHOIX_SIGN_IDENTITY (resolved in
# the sign job), CHOIX_NOTARY_PROFILE (a profile name, not a secret), and
# CHOIX_MAS_APP_IDENTITY, CHOIX_MAS_INSTALLER_IDENTITY, CHOIX_MAS_PROFILE and
# CHOIX_TEAM_ID (set in the mas job; the identities and the Team ID masked).
# See docs/release/signing-checklist.md.

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[2-9].[0-9]+.[0-9]+'
      - 'v[1-9][0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
      sign: ${{ steps.check.outputs.sign }}
      mas: ${{ steps.check.outputs.mas }}
    steps:
      - name: Resolve the version and check the secrets
        id: check
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          MAS_APP_CERTIFICATE: ${{ secrets.MAS_APP_CERTIFICATE }}
          MAS_APP_CERTIFICATE_PWD: ${{ secrets.MAS_APP_CERTIFICATE_PWD }}
          MAS_INSTALLER_CERTIFICATE: ${{ secrets.MAS_INSTALLER_CERTIFICATE }}
          MAS_INSTALLER_CERTIFICATE_PWD: ${{ secrets.MAS_INSTALLER_CERTIFICATE_PWD }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          summary() { printf '%s\n' "$@" >>"$GITHUB_STEP_SUMMARY"; }

          # For a tag v2.1.0 the version is 2.1.0: it is stamped into the
          # binary and Info.plist and names Choix-2.1.0-arm64.dmg, the asset
          # the cask downloads. Any other ref keeps the Taskfile's
          # git describe version.
          version=
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            v=${GITHUB_REF_NAME#v}
            if [[ $v =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] && ((BASH_REMATCH[1] >= 2)); then
              version=$v
            fi
          fi

          release=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ -z "$version" ]; then
              echo "::error title=Release version::Tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch> with major 2 or later. Nothing was built or published."
              exit 1
            fi
            release=true
          fi

          missing= present=0
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PWD APPSTORE_KEY_ID APPSTORE_ISSUER_ID APPSTORE_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then
              present=$((present + 1))
            else
              missing="$missing $name"
            fi
          done

          mas_missing= mas_present=0
          for name in MAS_APP_CERTIFICATE MAS_APP_CERTIFICATE_PWD MAS_INSTALLER_CERTIFICATE \
            MAS_INSTALLER_CERTIFICATE_PWD MAS_PROVISIONING_PROFILE APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              mas_present=$((mas_present + 1))
            else
              mas_missing="$mas_missing $name"
            fi
          done

          if [ "$release" = true ]; then
            [ -n "$TAP_GITHUB_TOKEN" ] || missing="$missing TAP_GITHUB_TOKEN"
            missing="$missing$mas_missing"
            if [ -n "$missing" ]; then
              echo "::error title=Release secrets::These repository secrets are missing or empty:$missing. Nothing was signed or published; see docs/release/signing-checklist.md."
              summary '### Release failed' '' "Missing repository secrets:$missing. Nothing was signed or published."
              exit 1
            fi
            sign=true
            mas=true
            summary '### Release' '' "Releases Choix $version: signs, notarizes, publishes the GitHub release v$version and updates the Homebrew cask. Also builds the Mac App Store package (artifact Choix-mas-pkg; it is not attached to the release, and the upload to App Store Connect is manual)."
          else
            if [ -z "$missing" ]; then
              sign=true
              summary '### Dry run' '' 'Builds, signs and notarizes Choix.app and the disk image (artifact Choix-dmg). Never creates a release and never touches the tap.'
            else
              sign=false
              # Some but not all set: a half-finished setup, worth a warning.
              if [ "$present" -gt 0 ]; then
                echo "::warning title=Signing skipped::These signing secrets are missing or empty:$missing."
              fi
              echo "::notice title=Signing skipped::Not every signing secret is set, so this dry run only builds the ad hoc signed Choix.app (artifact Choix-app)."
              summary '### Dry run, signing skipped' '' "Not every signing secret is set (missing:$missing), so signing and notarization were skipped. The ad hoc signed Choix.app (artifact Choix-app) is this run's output. A dry run never creates a release and never touches the tap."
            fi
            if [ -z "$mas_missing" ]; then
              mas=true
              summary '' 'Also builds the Mac App Store package (artifact Choix-mas-pkg). Nothing is uploaded to App Store Connect.'
            else
              mas=false
              if [ "$mas_present" -gt 0 ]; then
                echo "::warning title=Mac App Store package skipped::These Mac App Store secrets are missing or empty:$mas_missing."
              fi
              echo "::notice title=Mac App Store package skipped::Not every Mac App Store secret is set, so this dry run does not build the Mac App Store package."
              summary '' "Mac App Store package skipped: not every Mac App Store secret is set (missing:$mas_missing)."
            fi
          fi

          {
            echo "version=$version"
            echo "release=$release"
            echo "sign=$sign"
            echo "mas=$mas"
          } >>"$GITHUB_OUTPUT"

  build:
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.app.outputs.version }}
    steps:
      - name: Check the runner is Apple Silicon
        run: |
          arch=$(uname -m)
          if [ "$arch" != arm64 ]; then
            echo "::error title=Runner::Choix is built on Apple Silicon only; this runner is $arch."
            exit 1
          fi

      # The full history and tags: the Taskfile's BUILD is the commit count
      # and its default VERSION comes from git describe.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.x'
          check-latest: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.52.0

      - name: Build and package Choix.app
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            task package VERSION="$VERSION"
          else
            task package
          fi

      # The version the bundle was stamped with: the tag's for a release,
      # the Taskfile's git describe otherwise. It names the disk image.
      - name: Read the bundle's version
        id: app
        run: |
          version=$(plutil -extract CFBundleShortVersionString raw bin/Choix.app/Contents/Info.plist)
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Zip Choix.app
        run: ditto -c -k --keepParent bin/Choix.app bin/Choix.app.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Choix-app
          path: bin/Choix.app.zip
          if-no-files-found: error

  sign:
    needs: [gate, build]
    if: needs.gate.outputs.sign == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    outputs:
      sha256: ${{ steps.dmg.outputs.sha256 }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      # The notarytool keychain profile this job creates; a name, not a secret.
      CHOIX_NOTARY_PROFILE: choix-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.52.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Choix-app
          path: bin

      - name: Unzip Choix.app
        run: |
          ditto -x -k bin/Choix.app.zip bin
          rm bin/Choix.app.zip

      # A throwaway keychain, first in the search list and the default, so
      # codesign and notarytool's --keychain-profile find the identity and
      # the profile in it. The signing identity is the first valid
      # "Developer ID Application" identity of the imported certificate,
      # passed to the Taskfile as its SHA-1 hash in CHOIX_SIGN_IDENTITY.
      - name: Set up the signing keychain
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/choix-signing.keychain-db"
          p12="$RUNNER_TEMP/developer-id.p12"
          p8="$RUNNER_TEMP/notary-key.p8"
          # The decoded certificate and notary key never outlive this step,
          # whether it succeeds or fails; the cleanup step removes them too.
          trap 'rm -f "$p12" "$p8"' EXIT

          kc_password=$(openssl rand -hex 32)
          security create-keychain -p "$kc_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode >"$p12"
          security import "$p12" -k "$keychain" -f pkcs12 -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_password" "$keychain" >/dev/null
          existing=$(security list-keychains -d user | tr -d '"')
          # shellcheck disable=SC2086 # one keychain path per word
          security list-keychains -d user -s "$keychain" $existing
          security default-keychain -d user -s "$keychain"

          # Lines look like `  1) <SHA-1> "Developer ID Application: <name> (<team>)"`.
          identities=$(security find-identity -v -p codesigning "$keychain")
          identity=$(awk '/"Developer ID Application: / && !found { print $2; found = 1 }' <<<"$identities")
          if ! [[ $identity =~ ^[0-9A-F]{40}$ ]]; then
            echo "::error title=Release signing::MACOS_CERTIFICATE holds no valid Developer ID Application identity."
            # The listing without names, Team IDs or hashes: the log is public.
            security find-identity -p codesigning "$keychain" | sed -E -e 's/"[^"]*"/"…"/g' -e 's/[0-9A-Fa-f]{40}/<sha-1>/g'
            exit 1
          fi
          # Masked before it reaches GITHUB_ENV, whose values the log shows
          # with every later step. It is never echoed.
          echo "::add-mask::$identity"
          echo "CHOIX_SIGN_IDENTITY=$identity" >>"$GITHUB_ENV"

          printf '%s' "$APPSTORE_PRIVATE_KEY" | base64 --decode >"$p8"
          xcrun notarytool store-credentials "$CHOIX_NOTARY_PROFILE" --keychain "$keychain" \
            --key "$p8" --key-id "$APPSTORE_KEY_ID" --issuer "$APPSTORE_ISSUER_ID" >/dev/null
          rm -f "$p8"

      # The library, then the app (hardened runtime, secure timestamp,
      # build/darwin/entitlements.plist); the app is notarized and stapled;
      # the disk image (Choix.app plus an Applications link) is signed,
      # notarized and stapled; verify:release fails the job unless codesign,
      # Gatekeeper and both stapled tickets accept the result.
      - name: Sign, notarize, make the disk image and verify
        run: task sign:developer-id notarize dmg notarize:dmg verify:release VERSION="$VERSION"

      - name: Checksum the disk image
        id: dmg
        run: |
          dmg="bin/Choix-$VERSION-arm64.dmg"
          sha256=$(shasum -a 256 "$dmg" | awk '{ print $1 }')
          echo "sha256=$sha256" >>"$GITHUB_OUTPUT"
          printf '### Disk image\n\n`%s`, SHA-256 `%s`\n' "${dmg#bin/}" "$sha256" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Choix-dmg
          path: bin/Choix-${{ needs.build.outputs.version }}-arm64.dmg
          if-no-files-found: error

      # Runs whatever happened above, including a failure or cancellation
      # during the import: every credential path is known in advance.
      - name: Remove the signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8"
          keychain="$RUNNER_TEMP/choix-signing.keychain-db"
          if [ -e "$keychain" ]; then
            security delete-keychain "$keychain"
          fi

  # The Mac App Store package. It builds on its own (task package:mas runs
  # task build), so it needs only gate, and the release does not wait for
  # it: the .pkg is uploaded to App Store Connect by hand.
  mas:
    needs: gate
    if: needs.gate.outputs.mas == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check the runner is Apple Silicon
        run: |
          arch=$(uname -m)
          if [ "$arch" != arm64 ]; then
            echo "::error title=Runner::Choix is built on Apple Silicon only; this runner is $arch."
            exit 1
          fi

      # The full history and tags: package:mas needs a vX.Y.Z tag at or
      # before HEAD for its numeric version, and BUILD is the commit count.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # A release passes the tag's version. A dry run passes what the
      # Taskfile would take (git describe), and package:mas derives the
      # numeric App Store version from it; with no vX.Y.Z tag at or before
      # HEAD there is none, and the job stops here with a notice instead of
      # failing.
      - name: Resolve the package version
        id: version
        env:
          GATE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          version=${GATE_VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo 0.0.0-dev)}
          mas_version=$(printf '%s' "$version" | sed -e 's/^v//' -e 's/-.*$//')
          if ! printf '%s' "$mas_version" | grep -Eqx '[0-9]+(\.[0-9]+){0,2}'; then
            echo "::notice title=Mac App Store package skipped::No release tag vX.Y.Z at or before HEAD (git describe gave $version), so there is no numeric App Store version."
            printf '### Mac App Store package skipped\n\nNo release tag vX.Y.Z at or before HEAD (git describe gave `%s`).\n' "$version" >>"$GITHUB_STEP_SUMMARY"
            echo "skip=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "version=$version"
            echo "skip=false"
          } >>"$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.version.outputs.skip == 'false'
        with:
          go-version: '1.26.x'
          check-latest: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.version.outputs.skip == 'false'

      - name: Install Task
        if: steps.version.outputs.skip == 'false'
        run: go install github.com/go-task/task/v3/cmd/task@v3.52.0

      # A throwaway keychain, first in the search list and the default, so
      # codesign and productbuild find both identities in it. The app
      # identity is the first valid "Apple Distribution" (or older "3rd
      # Party Mac Developer Application") codesigning identity; the
      # installer identity, which is not a codesigning identity, the first
      # valid "Mac Installer Distribution" (or "3rd Party Mac Developer
      # Installer") identity. Both are passed as SHA-1 hashes, masked, as is
      # the Team ID.
      - name: Set up the Mac App Store keychain
        if: steps.version.outputs.skip == 'false'
        env:
          MAS_APP_CERTIFICATE: ${{ secrets.MAS_APP_CERTIFICATE }}
          MAS_APP_CERTIFICATE_PWD: ${{ secrets.MAS_APP_CERTIFICATE_PWD }}
          MAS_INSTALLER_CERTIFICATE: ${{ secrets.MAS_INSTALLER_CERTIFICATE }}
          MAS_INSTALLER_CERTIFICATE_PWD: ${{ secrets.MAS_INSTALLER_CERTIFICATE_PWD }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          umask 077
          # Masked first: productbuild and the rendered entitlements carry it.
          echo "::add-mask::$APPLE_TEAM_ID"
          if ! [[ $APPLE_TEAM_ID =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error title=Mac App Store signing::APPLE_TEAM_ID is not a 10-character Team ID (capital letters and digits)."
            exit 1
          fi

          keychain="$RUNNER_TEMP/choix-mas.keychain-db"
          app_p12="$RUNNER_TEMP/mas-app.p12"
          installer_p12="$RUNNER_TEMP/mas-installer.p12"
          profile="$RUNNER_TEMP/choix-mas.provisionprofile"
          # The decoded certificates never outlive this step, whether it
          # succeeds or fails; the cleanup step removes them and the profile
          # too. The profile stays until package:mas has copied it.
          trap 'rm -f "$app_p12" "$installer_p12"' EXIT

          kc_password=$(openssl rand -hex 32)
          security create-keychain -p "$kc_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_password" "$keychain"
          printf '%s' "$MAS_APP_CERTIFICATE" | base64 --decode >"$app_p12"
          security import "$app_p12" -k "$keychain" -f pkcs12 -P "$MAS_APP_CERTIFICATE_PWD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security >/dev/null
          rm -f "$app_p12"
          printf '%s' "$MAS_INSTALLER_CERTIFICATE" | base64 --decode >"$installer_p12"
          security import "$installer_p12" -k "$keychain" -f pkcs12 -P "$MAS_INSTALLER_CERTIFICATE_PWD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security >/dev/null
          rm -f "$installer_p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_password" "$keychain" >/dev/null
          existing=$(security list-keychains -d user | tr -d '"')
          # shellcheck disable=SC2086 # one keychain path per word
          security list-keychains -d user -s "$keychain" $existing
          security default-keychain -d user -s "$keychain"

          # Lines look like `  1) <SHA-1> "Apple Distribution: <name> (<team>)"`.
          # The listings without names, Team IDs or hashes on failure: the
          # log is public.
          redacted_listing() {
            security find-identity "$@" "$keychain" | sed -E -e 's/"[^"]*"/"…"/g' -e 's/[0-9A-Fa-f]{40}/<sha-1>/g'
          }
          identities=$(security find-identity -v -p codesigning "$keychain")
          app_identity=$(awk '/"(Apple Distribution|3rd Party Mac Developer Application): / && !found { print $2; found = 1 }' <<<"$identities")
          if ! [[ $app_identity =~ ^[0-9A-F]{40}$ ]]; then
            echo "::error title=Mac App Store signing::MAS_APP_CERTIFICATE holds no valid Apple Distribution identity."
            redacted_listing -p codesigning
            exit 1
          fi
          identities=$(security find-identity -v "$keychain")
          installer_identity=$(awk '/"(Mac Installer Distribution|3rd Party Mac Developer Installer): / && !found { print $2; found = 1 }' <<<"$identities")
          if ! [[ $installer_identity =~ ^[0-9A-F]{40}$ ]]; then
            echo "::error title=Mac App Store signing::MAS_INSTALLER_CERTIFICATE holds no valid Mac Installer Distribution identity."
            redacted_listing
            exit 1
          fi

          printf '%s' "$MAS_PROVISIONING_PROFILE" | base64 --decode >"$profile"
          if ! security cms -D -i "$profile" >/dev/null 2>&1; then
            echo "::error title=Mac App Store signing::MAS_PROVISIONING_PROFILE is not a signed provisioning profile."
            exit 1
          fi

          # Masked before they reach GITHUB_ENV, whose values the log shows
          # with every later step. None is echoed.
          echo "::add-mask::$app_identity"
          echo "::add-mask::$installer_identity"
          {
            echo "CHOIX_MAS_APP_IDENTITY=$app_identity"
            echo "CHOIX_MAS_INSTALLER_IDENTITY=$installer_identity"
            echo "CHOIX_MAS_PROFILE=$profile"
            echo "CHOIX_TEAM_ID=$APPLE_TEAM_ID"
          } >>"$GITHUB_ENV"

      # task build, bundle.sh with the numeric version, the profile as
      # Contents/embedded.provisionprofile, build/darwin/entitlements.mas.plist.tmpl
      # rendered with the Team ID, codesign with the Apple Distribution
      # identity, productbuild with the installer identity. productbuild
      # prints the signer's name and Team ID, so the output goes through
      # redact (the Team ID is masked as well).
      - name: Build and sign the Mac App Store package
        if: steps.version.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          redact() {
            sed -E -e '/^[[:space:]]*"?(origin|Authority|TeamIdentifier|teamId|teamIdentifier)"?[[:space:]]*[=:]/d' \
              -e 's/(Developer ID [A-Za-z]+|Apple Development|Apple Distribution|Mac Developer|3rd Party Mac Developer [A-Za-z]+|Mac Installer Distribution): [^"]*/\1: <redacted>/g'
          }
          task package:mas VERSION="$VERSION" 2>&1 | redact
          pkg="bin/Choix-$VERSION.pkg"
          test -f "$pkg"
          printf '### Mac App Store package\n\n`%s`, SHA-256 `%s` (artifact Choix-mas-pkg)\n' \
            "${pkg#bin/}" "$(shasum -a 256 "$pkg" | awk '{ print $1 }')" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.version.outputs.skip == 'false'
        with:
          name: Choix-mas-pkg
          path: bin/Choix-${{ steps.version.outputs.version }}.pkg
          if-no-files-found: error

      # Runs whatever happened above, including a failure or cancellation
      # during the import: every credential path is known in advance.
      - name: Remove the Mac App Store keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/mas-app.p12" "$RUNNER_TEMP/mas-installer.p12" \
            "$RUNNER_TEMP/choix-mas.provisionprofile" bin/entitlements.mas.plist
          keychain="$RUNNER_TEMP/choix-mas.keychain-db"
          if [ -e "$keychain" ]; then
            security delete-keychain "$keychain"
          fi

  release:
    needs: [gate, sign]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
    outputs:
      sha256: ${{ steps.check.outputs.sha256 }}
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Choix-dmg
          path: dist

      - name: Check the disk image
        id: check
        env:
          WANT_SHA256: ${{ needs.sign.outputs.sha256 }}
        run: |
          dmg="dist/Choix-$VERSION-arm64.dmg"
          sha256=$(sha256sum "$dmg" | cut -d ' ' -f 1)
          if [ "$sha256" != "$WANT_SHA256" ]; then
            echo "::error title=Disk image::$dmg has SHA-256 $sha256, but the sign job made $WANT_SHA256."
            exit 1
          fi
          echo "sha256=$sha256" >>"$GITHUB_OUTPUT"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v$VERSION" "dist/Choix-$VERSION-arm64.dmg" --verify-tag \
            --title "Choix $VERSION" --generate-notes

  # Writes Casks/choix.rb in the tap and pushes it with TAP_GITHUB_TOKEN.
  # cask_url keeps #{version} literally: it is Homebrew's interpolation of
  # the cask's version (single-quoted YAML, not a GitHub expression).
  # cask_depends_on is written after `depends_on `, giving
  # `depends_on arch: :arm64, macos: :sonoma` (Apple Silicon, macOS 14 or
  # later; a bare symbol means "this or later", and the ">= :sonoma" string
  # form is deprecated in Homebrew).
  homebrew:
    needs: [gate, release]
    if: needs.gate.outputs.release == 'true'
    permissions: {}
    uses: volodymyrsmirnov/homebrew-tap/.github/workflows/update.yml@main
    with:
      type: cask
      name: choix
      version: v${{ needs.gate.outputs.version }}
      desc: 'Photo and video culling: group shoots by scene and pick favourites'
      homepage: 'https://github.com/volodymyrsmirnov/choix'
      cask_url: 'https://github.com/volodymyrsmirnov/choix/releases/download/v#{version}/Choix-#{version}-arm64.dmg'
      cask_sha256: ${{ needs.release.outputs.sha256 }}
      cask_app_name: 'Choix.app'
      cask_depends_on: 'arch: :arm64, macos: :sonoma'
    secrets:
      tap_token: ${{ secrets.TAP_GITHUB_TOKEN }}
